version: 2

models:
  - name: stg_products
    columns:
      - name: product_code
        data_tests:
          - not_null
          - unique

  - name: stg_tickets
    columns:
      - name: ticket_id
        data_tests:
          - not_null

  - name: stg_sales_lines
    columns:
      - name: ticket_id
        data_tests:
          - not_null

      - name: product_code
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_code